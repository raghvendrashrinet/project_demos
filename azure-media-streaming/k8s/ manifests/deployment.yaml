apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-api
  namespace: video-platform
  labels:
    app: video-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: video-api
  template:
    metadata:
      labels:
        app: video-api
    spec:
      # Use AKS node identity (no connection string needed if using Managed Identity)
      containers:
        - name: api
          image: <registry>.azurecr.io/video-platform:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: video-config
            - secretRef:
                name: video-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5   
