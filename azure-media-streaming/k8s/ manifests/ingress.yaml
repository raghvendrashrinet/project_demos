apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: video-ingress
  namespace: video-platform
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "2G"   # allow large uploads
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - yourapp.com
      secretName: video-tls
  rules:
    - host: yourapp.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: video-api
                port:
                  number: 80   
